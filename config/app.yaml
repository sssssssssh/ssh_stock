app:
  name: 空间
  timezone: Asia/Shanghai
  algo_version: v1.1
  scheduler:
    daily_cron: "10 18 * * 1-5"
    basic_info_cron: "30 9 * * 6"
    max_catchup_trade_days: 20
    queued_stale_hours: 24
    running_heartbeat_timeout_minutes: 15
    worker_heartbeat_interval_seconds: 45
    dirty_processing_timeout_minutes: 30
    stale_recovery_interval_seconds: 60
    refresh_recent_trade_days: 5
    dirty_max_retry_count: 3
    worker_poll_seconds: 2
    service_heartbeat_interval_seconds: 45
    service_stale_seconds: 120
    eod_retry_cron: "10,30,50 18-19 * * 1-5"
    eod_retry_final_cron: "10,30 20 * * 1-5"

provider:
  tushare:
    safe_limits:
      ths_index: 5000
      ths_daily: 3000
      moneyflow_cnt_ths: 5000
      limit_cpt_list: 2000
      # Conservative alert threshold; this proxy returned 6000 rows for a truncated request.
      ths_member: 6000

research:
  enabled: true
  daily_cron: "30 19 * * 1-5"

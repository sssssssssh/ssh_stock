research:
  version: research_v1
  eval_version: research_eval_v2
  benchmark_code: "000300.SH"
  stock:
    entry_basis: NEXT_OPEN
  theme:
    entry_basis: NEXT_CLOSE
    min_data_coverage: 0.50
  horizons: [5, 10, 20, 60]
  transition_horizons: [5, 10, 20]
  left_thresholds: [60, 65, 70, 75, 80, 85]
  trend_topn: [20, 50, 100]
  theme_topn: [5, 10, 20]
  score_bucket_size: 10
  refresh_lookback_trade_days: 65
  batch_trade_days: 20
  min_sample_warning: 30
  executable_exit_search_days: 5
  trading_cost:
    enabled: true
    commission_rate: 0.0003
    minimum_commission_cny: 5
    stamp_tax_sell_rate: 0.0005
    slippage_bps: 5

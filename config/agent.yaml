agent:
  registry_version: m16.3-v1
  mode: tools_only
  llm_enabled: false
  max_output_bytes: 65536
  max_coverage_datasets: 32
  max_evidence_refs: 64
  max_warnings: 128
  default_timeout_seconds: 5
  max_tool_timeout_seconds: 30
  statement_timeout_ms: 5000
  archive:
    enabled: false
    max_payload_bytes: 65536
    max_turn_bytes: 655360
    max_tool_calls: 8
    max_bindings: 64
    verify_timeout_seconds: 5
  frozen_contract:
    enabled: false
    max_contract_bytes: 131072
    max_turn_bytes: 1048576
    max_contracts: 100
    max_trade_dates: 5000
    verify_timeout_seconds: 5
  reports:
    max_snapshot_bytes: 262144
    max_claims: 50
    max_citations: 100
    max_sections: 12
    max_charts: 8
    max_points_per_chart: 300
    max_comparison_facts: 100
  llm:
    provider: openai_compatible
    model: gpt-4o-mini
    base_url: https://api.openai.com/v1
    auth_scheme: bearer
    api_key_env: OPENAI_API_KEY
    request_timeout_seconds: 20
    max_output_tokens: 1200
    temperature: 0.1
    max_provider_retries: 1
    max_tool_rounds: 3
    max_tool_calls_total: 8
    max_tool_calls_per_round: 4
    max_context_messages: 12
    max_user_message_chars: 4000
    max_answer_chars: 8000
    max_total_deadline_seconds: 45
    max_claims: 16
    max_evidence_ids_per_claim: 8
    max_structured_facts_per_claim: 12

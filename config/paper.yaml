paper:
  enabled: false
  auto_advance: false
  auto_approve: false
  policy:
    version: m17-paper-policy-v1
    mode: PAPER
    approval_mode: MANUAL_CONFIRM
    market_data_mode: POST_EOD_SIMULATED_OPEN
    pending_order_policy: REJECT_CONFLICTING_PENDING
    blocked_order_policy: SKIP_NO_RETRY
    corporate_action_policy: FAIL_CLOSED
    risk:
      max_positions: 10
      max_single_position_weight: '0.10'
      min_cash_ratio: '0.02'
      max_new_positions_per_day: 2
      max_sector_weight: '0.30'
      max_theme_weight: '0.30'
      max_daily_turnover: '0.50'
  decision:
    version: m17-decision-rule-v1
    daily_observation_enabled: false
    top_n: 20

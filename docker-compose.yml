services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: stock_db
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build: .
    command: python -m app.cli scheduler
    env_file: .env
    depends_on:
      - postgres

volumes:
  pg_data:


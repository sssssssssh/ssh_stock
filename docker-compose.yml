x-app-common: &app-common
  image: ssh-stock-app:local
  build:
    context: .
  env_file:
    - .env
  environment:
    DATABASE_URL: ${DOCKER_DATABASE_URL}

services:
  migration:
    <<: *app-common
    command: python -m alembic upgrade head
    restart: "no"

  backend:
    <<: *app-common
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9034:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *app-common
    command: python -m app.cli worker
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully

  scheduler:
    <<: *app-common
    command: python -m app.cli scheduler
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully

  frontend:
    image: ssh-stock-frontend:local
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12

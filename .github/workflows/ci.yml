name: CI

"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: stock_db
          POSTGRES_USER: stock
          POSTGRES_PASSWORD: stock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock -d stock_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://stock:stock@127.0.0.1:5432/stock_db
      DOCKER_DATABASE_URL: postgresql+psycopg://stock:stock@postgres:5432/stock_db
      TUSHARE_TOKEN: test-token
      M17_MEASUREMENT_PATH: .codex_tmp/m17_capacity.jsonl
      M17_1_1_MEASUREMENT_PATH: .codex_tmp/m17_1_1-retention.jsonl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - name: V1.4 physically isolated and marked PG17
        run: |
          V14_INSTANCE=$(python -c 'import uuid; print(uuid.uuid4())')
          docker run -d --name v14-isolated-pg17 --label purpose=ssh-stock-v14-physical-test \
            -e POSTGRES_DB=v14_test -e POSTGRES_USER=stock -e POSTGRES_PASSWORD=stock \
            -p 127.0.0.1:55438:5432 postgres:17 -c "v14.test_instance=$V14_INSTANCE" \
            -c shared_preload_libraries=pg_stat_statements -c track_io_timing=on \
            -c pg_stat_statements.track=all
          for attempt in $(seq 1 30); do
            docker exec v14-isolated-pg17 pg_isready -U stock -d v14_test && break
            sleep 1
          done
          docker exec v14-isolated-pg17 pg_isready -U stock -d v14_test
          V14_SYSTEM_ID=$(docker exec v14-isolated-pg17 psql -U stock -d v14_test -Atc \
            'SELECT system_identifier FROM pg_control_system()')
          echo "V14_TEST_INSTANCE=$V14_INSTANCE" >> "$GITHUB_ENV"
          echo "V14_TEST_SYSTEM_IDENTIFIER=$V14_SYSTEM_ID" >> "$GITHUB_ENV"
          echo 'TEST_DATABASE_URL=postgresql+psycopg://stock:stock@127.0.0.1:55438/v14_test' >> "$GITHUB_ENV"
      - name: V1.4 calendar and overlay read regressions
        # Some legacy integration tests use the explicit parent synthetic DB.
        # Migrate that parent too; all V14 cases still create their own UUID DB.
        env:
          DATABASE_URL: postgresql+psycopg://stock:stock@127.0.0.1:55438/v14_test
        run: |
          python -c 'from scripts.v14_test_database import verified_test_url; verified_test_url(); from alembic import command; from alembic.config import Config; command.upgrade(Config("alembic.ini"), "head")'
          python -m pytest tests/integration/test_v14_calendar_guard.py tests/integration/test_ab_merge_read_v14.py tests/unit/test_v14_test_database.py tests/unit/test_ab_read_benchmark_v14.py -q --junitxml=.codex_tmp/v14-targeted.xml
      - name: V1.4 frozen Q0 Q1 Q2 cursor smoke (not performance closure)
        run: >-
          python scripts/ab_read_benchmark_v14.py --variant all --readers 2
          --output .codex_tmp/v14-read-ci-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-read-evidence
          include-hidden-files: true
          path: .codex_tmp/v14-*
          if-no-files-found: error
      - run: python -m alembic upgrade head
      - run: python -m alembic downgrade 0019_research_source_lineage
      - run: python -m alembic upgrade head
      - name: M17.1.2 suspension schema and ingestion regressions
        run: >-
          python -m pytest tests/unit/test_suspend_normalization.py
          tests/integration/test_suspend_timing_schema.py
          tests/integration/test_ingestion_suspend.py -q
          --junitxml=.codex_tmp/m17_1_2-targeted.xml
      - name: M17.1 targeted dirty dependency regressions
        # All retention writes/concurrency tests use disposable PG17 databases.
        run: python -m pytest tests/integration/test_m17_1_dirty_dependencies.py -q
      - name: Data publication and schedule compensation regressions
        run: >-
          python -m pytest tests/integration/test_data_publication.py
          tests/integration/test_schedule_compensation.py tests/unit/test_scheduler_capacity.py
          tests/unit/test_data_job_diagnostics.py -q
          --junitxml=.codex_tmp/data-publication-targeted.xml
      - name: Cold start engines and zero-write CLI regressions
        run: >-
          python -m pytest tests/unit/test_cold_start_v12.py
          tests/unit/test_cli_derived_safety.py tests/integration/test_cold_start_cli_v12.py -q
          --junitxml=.codex_tmp/cold-start-targeted.xml
      - name: Cold start baseline golden and missing-input comparison
        run: python scripts/cold_start_comparison.py --output .codex_tmp/cold-start-comparison.json
      - name: M17.1.1 reference-aware retention regressions
        run: >-
          python -m pytest tests/integration/test_m17_1_1_retention.py
          tests/integration/test_m17_1_1_retention_paper.py
          tests/integration/test_m17_1_1_retention_capacity.py
          tests/integration/test_m17_1_1_retention_migration.py
          tests/integration/test_m17_1_1_retention_frozen.py -q
      - name: M17.1 isolated PAPER continuity regressions
        run: |
          python -m pytest tests/integration/test_m17_decision_sources.py -q
          python -m pytest tests/integration/test_m17_paper_daily.py -q
          python -m pytest tests/integration/test_m17_paper_jobs.py -q
          python -m pytest tests/integration/test_m17_1_paper_continuity.py -q
      - run: >-
          python -m pytest --cov=backend/app --cov-report=term-missing --cov-fail-under=70
          --junitxml=.codex_tmp/m17_1_2-full.xml
      - name: M16.6 capture capacity measurements
        run: python -m pytest tests/integration/test_m16_6_window_end_to_end.py -k maximum -s -q
      - run: python -m alembic current
      - run: python -m alembic heads
      - run: python -m ruff check backend tests migrations scripts
      - run: cp .env.example .env
      - run: docker compose config
      - run: docker compose build
      - name: Data queue single/two Worker and atomic publication acceptance
        run: TEST_DATABASE_URL="$DATABASE_URL" python scripts/data_queue_container_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-queue-container-acceptance
          include-hidden-files: true
          path: .codex_tmp/data-queue-containers.json
          if-no-files-found: error
      - run: docker run --rm --add-host backend:127.0.0.1 ssh-stock-frontend:local nginx -t
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: M17.1 dependency risk inventory (not an upgrade)
        run: |
          node --test scripts/m17_1_dependency_audit.test.cjs
          node scripts/m17_1_dependency_audit.cjs
      - run: npm run test:coverage
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: M16.6 browser acceptance (isolated runner tooling)
        run: |
          npm install --prefix "$RUNNER_TEMP/m166-browser" --no-save --package-lock=false playwright@1.64.0
          node "$RUNNER_TEMP/m166-browser/node_modules/playwright/cli.js" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/m166-browser/node_modules/playwright" node scripts/m16_6_browser_smoke.cjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/m166-browser/node_modules/playwright" node scripts/m17_browser_smoke.cjs
      - name: M17.1.1 and M17.1.2 exact HEAD and migration receipts
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, text

          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["GITHUB_SHA"], "CI_HEAD_MISMATCH"
          engine = create_engine(os.environ["DATABASE_URL"])
          try:
              with engine.connect() as connection:
                  current = connection.scalar(text("SELECT version_num FROM alembic_version"))
                  pg_version = connection.scalar(text("SHOW server_version_num"))
                  timing_column = dict(connection.execute(text(
                      "SELECT data_type, character_maximum_length, is_nullable "
                      "FROM information_schema.columns WHERE table_schema='public' "
                      "AND table_name='stock_suspend_daily' AND column_name='suspend_timing'"
                  )).mappings().one())
          finally:
              engine.dispose()
          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          assert heads == [current] == ["0058_data_publication"], "CI_MIGRATION_HEAD_MISMATCH"
          assert pg_version.startswith("17"), "CI_POSTGRES_MAJOR_MISMATCH"
          assert timing_column == {
              "data_type": "text", "character_maximum_length": None, "is_nullable": "YES",
          }, "CI_SUSPEND_TIMING_SCHEMA_MISMATCH"
          run_url = (f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                     f"{os.environ['GITHUB_RUN_ID']}")
          receipt = {
              "schema_version": "m17.1.1-ci-receipt-v1", "head_sha": head,
              "run_url": run_url, "alembic_current": current, "alembic_heads": heads,
              "postgres_version_num": pg_version,
              "created_at": datetime.now(UTC).isoformat(),
              "scope": "All preceding blocking steps passed; final Actions conclusion is authoritative",
          }
          output = Path(".codex_tmp/m17_1_1-release.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          suspend_receipt = {
              **receipt, "schema_version": "m17.1.2-ci-receipt-v1",
              "suspend_timing_column": timing_column,
              "targeted_junit": "m17_1_2-targeted.xml",
              "full_junit": "m17_1_2-full.xml",
              "production_validation": "PENDING_APPROVAL", "production_job_id": None,
          }
          Path(".codex_tmp/m17_1_2-release.json").write_text(
              json.dumps(suspend_receipt, indent=2) + "\n", encoding="utf-8",
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(f"## M17.1.1\n\nHEAD: `{head}`\n\nCI: {run_url}\n\n"
                           f"Alembic current=heads: `{current}`\n")
              stream.write(f"\n## M17.1.2\n\nHEAD: `{head}`\n\nCI: {run_url}\n\n"
                           "suspend_timing: nullable TEXT; G1 real backfill pending approval.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m16-6-synthetic-browser
          path: frontend/coverage/browser
          if-no-files-found: ignore
      - name: Runtime reliability desktop and narrow-screen synthetic acceptance
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/m166-browser/node_modules/playwright" node scripts/runtime_reliability_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-reliability-synthetic-browser
          path: frontend/coverage/runtime-reliability-browser
          if-no-files-found: error
      - name: Core exact SHA bundle, independent of long capacity workloads
        if: always()
        env:
          UPSTREAM_STATUS: ${{ job.status }}
        run: python scripts/ci_release_gate_v14_a4_2_1.py core-status --job-id core --output .codex_tmp/a421/core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a421-core-${{ github.sha }}-attempt${{ github.run_attempt }}
          include-hidden-files: true
          path: .codex_tmp/a421
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-publication-reliability
          include-hidden-files: true
          path: |
            .codex_tmp/data-publication-release.json
            .codex_tmp/data-publication-targeted.xml
            .codex_tmp/m17_1_2-full.xml
            .codex_tmp/cold-start-targeted.xml
            .codex_tmp/cold-start-comparison.json
            .codex_tmp/cold-start-capacity.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m17-capacity-measurements
          include-hidden-files: true
          path: .codex_tmp/m17_capacity.jsonl
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m17-1-dependency-audit
          include-hidden-files: true
          path: .codex_tmp/m17_1-dependency-audit.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m17-1-1-retention-evidence
          include-hidden-files: true
          path: |
            .codex_tmp/m17_1_1-retention.jsonl
            .codex_tmp/m17_1_1-release.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m17-1-2-suspend-evidence
          include-hidden-files: true
          path: |
            .codex_tmp/m17_1_2-targeted.xml
            .codex_tmp/m17_1_2-full.xml
            .codex_tmp/m17_1_2-release.json
          if-no-files-found: ignore

  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        level: [L1, L2, L3-scaled-10pct]
    env:
      PYTHONUNBUFFERED: "1"
      LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - uses: ./.github/actions/a421-pg
        with:
          resource-class: capacity
      - name: Original full single-level workload, publication budgets unchanged
        run: >-
          python scripts/data_publication_capacity_v12.py --confirm-synthetic
          --level "${{ matrix.level }}" --output .codex_tmp/a421/capacity-${{ matrix.level }}/capacity.json
      - if: always()
        env:
          UPSTREAM_STATUS: ${{ job.status }}
        run: >-
          python scripts/ci_release_gate_v14_a4_2_1.py status
          --job-id "capacity-${{ matrix.level }}" --output ".codex_tmp/a421/capacity-${{ matrix.level }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a421-capacity-${{ matrix.level }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: .codex_tmp/a421
          include-hidden-files: true
          if-no-files-found: error
      - if: always()
        run: docker rm -f a421-pg17

  publication-release-gate:
    needs: [test, capacity]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: a421-*-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: .codex_tmp/a421-input
      - name: Strict three-level merge and original exact SHA release assertions
        if: always()
        env:
          A421_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/ci_release_gate_v14_a4_2_1.py publication --output .codex_tmp/a421-publication-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a421-publication-release-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            .codex_tmp/a421-publication-gate.json
            .codex_tmp/cold-start-capacity.json
          include-hidden-files: true
          if-no-files-found: error

  ui-visual-acceptance:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/ui-visual-upgrade') ||
      (github.event_name == 'pull_request' && github.head_ref == 'codex/ui-visual-upgrade' && github.base_ref == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VITE_API_BASE_URL: /api/v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare isolated evidence directory
        run: |
          mkdir -p "$RUNNER_TEMP/ui-visual/$GITHUB_SHA/logs"
          echo "BROWSER_ARTIFACT_DIR=$RUNNER_TEMP/ui-visual/$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ui-browser-cache" >> "$GITHUB_ENV"
      - name: Verify frozen Git tree is available
        run: git cat-file -e 0136ee9e03727314102cc041d52dd488cca50def^{commit}
      - name: Frontend clean installation
        run: npm ci
        working-directory: frontend
      - name: UI-only source integrity and isolated negative controls
        run: |
          set -o pipefail
          node scripts/ui_visual_integrity.cjs 2>&1 | tee "$BROWSER_ARTIFACT_DIR/logs/integrity.log"
          node scripts/ui_visual_integrity.cjs --self-test 2>&1 | tee "$BROWSER_ARTIFACT_DIR/logs/negative-controls.log"
      - name: Original frontend coverage and production build
        run: |
          set -o pipefail
          npm --prefix frontend run test:coverage 2>&1 | tee "$BROWSER_ARTIFACT_DIR/logs/coverage.log"
          npm --prefix frontend run build 2>&1 | tee "$BROWSER_ARTIFACT_DIR/logs/build.log"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ui-browser-cache
          key: ui-chromium-${{ runner.os }}-playwright-1.64.0
      - name: Install pinned isolated browser tooling
        run: |
          set -o pipefail
          npm install --prefix "$RUNNER_TEMP/ui-browser" --no-save --package-lock=false playwright@1.64.0 2>&1 | tee "$BROWSER_ARTIFACT_DIR/logs/playwright-install.log"
          node "$RUNNER_TEMP/ui-browser/node_modules/playwright/cli.js" install --with-deps chromium 2>&1 | tee "$BROWSER_ARTIFACT_DIR/logs/chromium-install.log"
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/ui-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: UI five-width nine-state before-after acceptance and short screen
        run: |
          set -o pipefail
          node scripts/ui_visual_browser.cjs 2>&1 | tee "$BROWSER_ARTIFACT_DIR/logs/browser.log"
      - name: Recheck source integrity after browser execution
        run: |
          set -o pipefail
          node scripts/ui_visual_integrity.cjs 2>&1 | tee "$BROWSER_ARTIFACT_DIR/logs/integrity-after.log"
      - name: Preserve explicit incomplete receipt on early failures
        if: always()
        run: |
          node - <<'JS'
          const fs=require('node:fs'), path=require('node:path');
          const output=process.env.BROWSER_ARTIFACT_DIR || path.join(process.env.RUNNER_TEMP,'ui-visual',process.env.GITHUB_SHA);
          fs.mkdirSync(output,{recursive:true});
          const file=path.join(output,'result.json');
          if(!fs.existsSync(file)) fs.writeFileSync(file,JSON.stringify({
            head_sha:process.env.GITHUB_SHA,status:'not_completed',
            reason:'A blocking installation, integrity, test or build step did not complete. See logs and job steps.',
            run_url:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
          },null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-visual-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/ui-visual
          if-no-files-found: error
          retention-days: 14

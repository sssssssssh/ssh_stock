name: a4232-statistics-tail-diagnostic

"on":
  push:
    branches: [master]
    paths:
      - '.github/workflows/a4232-statistics-tail-diagnostic.yml'
      - 'scripts/*a4232*.py'
      - 'tests/**/test_tail_stability_a4232.py'
      - 'docs/acceptance/*a4_2_3_2*'
  pull_request:
    paths:
      - '.github/workflows/a4232-statistics-tail-diagnostic.yml'
      - 'scripts/*a4232*.py'
      - 'tests/**/test_tail_stability_a4232.py'
      - 'docs/acceptance/*a4_2_3_2*'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - uses: ./.github/actions/a421-pg
        with:
          resource-class: capacity
      - name: Small PG17, natural GC, plan/statistics and existing A/B safety contracts only
        run: >-
          python -m pytest --tb=no --show-capture=no
          tests/unit/test_tail_stability_a4232.py
          tests/unit/test_tail_historical_a4231.py
          tests/unit/test_lookup_tail_attribution_a4231.py
          tests/unit/test_tail_attribution_review_a4231.py
          tests/integration/test_tail_stability_a4232.py
          tests/integration/test_lookup_candidates_a422.py
          --junitxml=.codex_tmp/a4232-internal/preflight.xml
      - name: Sanitized test receipt, never raw assertion/driver SQL text
        if: always()
        run: >-
          python -m scripts.a4232_test_receipt
          --source .codex_tmp/a4232-internal/preflight.xml
          --output .codex_tmp/a4232-contract/tests.json
      - run: python -m ruff check backend tests migrations scripts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a4232-contract-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: .codex_tmp/a4232-contract
          include-hidden-files: true
          if-no-files-found: error
      - if: always()
        run: docker rm -f a421-pg17

  attribution:
    needs: contracts
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, '[a4232-statstable-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - name: Frozen protocol and production before any database access
        run: python -c 'from scripts.a4232_stability_contract import guard; guard()'
      - uses: ./.github/actions/a421-pg
        with:
          resource-class: capacity
      - name: Exactly one preregistered statistics-stable diagnostic batch
        run: >-
          python scripts/publication_tail_stability_a4232.py
          --output .codex_tmp/a4232/attribution.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a4232-attribution-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: .codex_tmp/a4232
          include-hidden-files: true
          if-no-files-found: error
      - if: always()
        run: docker rm -f a421-pg17

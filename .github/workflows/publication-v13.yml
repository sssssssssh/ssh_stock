name: Publication V1.3

"on":
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact reviewed 40-character commit SHA
        required: true
        type: string
      confirm_expensive_run:
        description: Explicit diagnostic authorization, not production or release
        required: true
        type: boolean
        default: false
      run_reason:
        description: Reviewed reason, without secrets
        required: true
        type: string
      protocol_id:
        description: Fixed protocol ID from the governance policy
        required: true
        type: string
      protocol_sha256:
        description: Frozen protocol SHA256 from the governance policy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'ssh-stock-a4-expensive' || format('a4-l0-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false

jobs:
  authorize:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: a4-expensive-measurements
    env:
      A4_REVIEW_POLICY_ACK: ${{ vars.A4_REVIEW_POLICY_ACK }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/a4-governance
        with:
          suite: publication-v13
      - if: always()
        uses: ./.github/actions/a4-finish
        with:
          status: ${{ job.status }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a4-ci-v13-authorization-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex_tmp/a4-ci
          include-hidden-files: true
          if-no-files-found: error

  contracts:
    needs: authorize
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || needs.authorize.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LLM_ENABLED: "false"
    outputs:
      ci_opt_verified: ${{ steps.ci_result.outputs.verified }}
      ci_opt_scope: ${{ steps.ci_scope.outputs.scope }}
      ci_opt_head: ${{ steps.ci_result.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changes and validate registered prose
        id: ci_scope
        uses: ./.github/actions/ci-scope
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
        id: ci_full_01
        if: steps.ci_scope.outputs.scope != 'docs'
      - run: python -m pip install -r requirements.lock
        id: ci_full_02
        if: steps.ci_scope.outputs.scope != 'docs'
      - uses: ./.github/actions/a421-pg
        with:
          database: publication_v13_test
        id: ci_full_03
        if: steps.ci_scope.outputs.scope != 'docs'
      - run: python -m alembic upgrade head
        id: ci_full_04
        if: steps.ci_scope.outputs.scope != 'docs'
      - run: python -m alembic current
        id: ci_full_05
        if: steps.ci_scope.outputs.scope != 'docs'
      - run: python -m alembic heads
        id: ci_full_06
        if: steps.ci_scope.outputs.scope != 'docs'
      - name: Candidate equivalence, real row locks, isolation and cancellation
        run: >-
          python -m pytest tests/integration/test_publication_lookup_v13.py
          tests/integration/test_publication_cancel_v13.py
          tests/integration/test_calculation_batch_progress.py
          tests/integration/test_data_publication.py
          tests/unit/test_calculation_progress.py tests/unit/test_publication_benchmark_v13.py
          tests/unit/test_cli_derived_safety.py
          tests/unit/test_publication_v13_receipt.py
          --junitxml=.codex_tmp/v13-targeted.xml
        id: ci_full_07
        if: steps.ci_scope.outputs.scope != 'docs'
      - run: python -m ruff check backend tests migrations scripts
        id: ci_full_08
        if: steps.ci_scope.outputs.scope != 'docs'
      - id: cleanup
        if: ${{ (steps.ci_scope.outputs.scope != 'docs') && (always()) }}
        uses: ./.github/actions/a4-cleanup
      - if: ${{ (steps.ci_scope.outputs.scope != 'docs') && (always()) }}
        uses: ./.github/actions/a4-finish
        with:
          status: ${{ job.status }}
          cleanup: ${{ steps.cleanup.outcome }}
        id: ci_full_10
      - uses: actions/upload-artifact@v4
        if: ${{ (steps.ci_scope.outputs.scope != 'docs') && (always()) }}
        with:
          name: publication-v13-contract-${{ github.sha }}-attempt${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .codex_tmp/v13-targeted.xml
            .codex_tmp/a4-ci
          if-no-files-found: error
        id: ci_full_11
      - name: Verify the actual route and mandatory step outcomes
        id: ci_result
        if: always()
        env:
          CI_OPT_STEPS: ${{ toJSON(steps) }}
          CI_OPT_STATUS: ${{ job.status }}
        run: python -m scripts.ci_status_summary job --workflow publication-v13.yml --job contracts
      - name: Upload CI routing evidence, never a performance receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-opt-01-${{ github.job }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex_tmp/ci-opt
          include-hidden-files: true
          if-no-files-found: error

  candidate-performance:
    needs: [authorize, contracts]
    if: github.event_name == 'workflow_dispatch' && needs.authorize.result == 'success' && inputs.confirm_expensive_run == true && inputs.target_sha == github.sha && github.ref == 'refs/heads/master' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment: a4-expensive-measurements
    env:
      A4_REVIEW_POLICY_ACK: ${{ vars.A4_REVIEW_POLICY_ACK }}
      TUSHARE_TOKEN: synthetic-v13
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/a4-governance
        with:
          suite: publication-v13
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - uses: ./.github/actions/a421-pg
        with:
          resource-class: capacity
          database: publication_v13_test
      - run: git rev-parse HEAD
      - run: python -m alembic upgrade head
      - run: python -m alembic current
      - run: python -m alembic heads
      - name: Candidate equivalence, real row locks, isolation and cancellation
        run: >-
          python -m pytest tests/integration/test_publication_lookup_v13.py
          tests/integration/test_publication_cancel_v13.py
          tests/integration/test_calculation_batch_progress.py
          tests/integration/test_data_publication.py
          tests/unit/test_calculation_progress.py tests/unit/test_publication_benchmark_v13.py
          tests/unit/test_cli_derived_safety.py
          tests/unit/test_publication_v13_receipt.py
          --junitxml=.codex_tmp/v13-targeted.xml
      - run: python -m ruff check backend tests migrations scripts
      - name: Frozen baseline B0 B1 B2, three repetitions, public A present
        run: >-
          python scripts/publication_candidate_benchmark_v13.py --confirm-synthetic
          --implementation baseline --rows 1000 100000 500000 --repeats 3 --public
          --output .codex_tmp/v13-baseline.json
      - name: Current B0 B1 B2, identical input and reader workload
        run: >-
          python scripts/publication_candidate_benchmark_v13.py --confirm-synthetic
          --implementation current --rows 1000 100000 500000 --repeats 3 --public
          --output .codex_tmp/v13-current.json
      - name: Empty A and existing candidate matrix
        run: |
          for implementation in baseline current; do
            python scripts/publication_candidate_benchmark_v13.py --confirm-synthetic --implementation "$implementation" --rows 1000 --repeats 3 --output ".codex_tmp/v13-empty-$implementation.json"
            python scripts/publication_candidate_benchmark_v13.py --confirm-synthetic --implementation "$implementation" --rows 1000 --repeats 3 --existing 500000 --output ".codex_tmp/v13-existing-$implementation.json"
            python scripts/publication_candidate_benchmark_v13.py --confirm-synthetic --implementation "$implementation" --rows 1000 --repeats 3 --existing 500000 --public --output ".codex_tmp/v13-existing-public-$implementation.json"
          done
      - name: Scope memory and bounded deletion-mask sample
        run: |
          for amount in 500000 1000000; do
            python scripts/publication_candidate_benchmark_v13.py --confirm-synthetic --implementation current --rows 1000 --repeats 1 --existing "$amount" --public --scope-probe --output ".codex_tmp/v13-scope-$amount.json"
          done
      - name: Bounded key workload scaling, 500 5000 50000 inputs
        run: |
          for implementation in baseline current; do
            python scripts/publication_candidate_benchmark_v13.py --confirm-synthetic --implementation "$implementation" --rows 500 5000 50000 --repeats 3 --existing 500000 --public --output ".codex_tmp/v13-keys-$implementation.json"
          done
      - name: Exact SHA receipts and honest performance status
        run: >-
          python scripts/publication_v13_receipt.py --baseline .codex_tmp/v13-baseline.json
          --current .codex_tmp/v13-current.json --junit .codex_tmp/v13-targeted.xml
          --output .codex_tmp/v13-comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-v13-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          include-hidden-files: true
          path: .codex_tmp/v13-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-v13-junit-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          include-hidden-files: true
          path: .codex_tmp/v13-targeted.xml
          if-no-files-found: error
      - id: cleanup
        if: always()
        uses: ./.github/actions/a4-cleanup
      - if: always()
        uses: ./.github/actions/a4-finish
        with:
          status: ${{ job.status }}
          cleanup: ${{ steps.cleanup.outcome }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a4-ci-v13-state-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex_tmp/a4-ci
          include-hidden-files: true
          if-no-files-found: error

  ci-summary:
    name: ci-opt-01-publication-v13
    if: always()
    needs:
    - contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Reject missing, skipped, cancelled or failed mandatory checks
      env:
        CI_OPT_NEEDS: ${{ toJSON(needs) }}
      run: python -m scripts.ci_status_summary workflow --workflow publication-v13.yml

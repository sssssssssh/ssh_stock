name: A4-2 isolated read experiments

"on":
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    env:
      LLM_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - id: matrix
        name: Exact legacy matrix, no omissions or duplicate assignments
        run: |
          python -c 'import json; from dataclasses import asdict; from scripts.a42_ci_contract import shards,matrix; matrix(); print("value="+json.dumps({"include":[asdict(s) for s in shards()]}))' >> "$GITHUB_OUTPUT"
          python -m scripts.a42_ci_contract --output .codex_tmp/a421/contract/matrix.json
      - uses: ./.github/actions/a421-pg
      - name: Frozen sources and formal parent migration
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/ab_read_experiment_v14_a4_2.py --contract-only --output .codex_tmp/a421/contract/source.json
          python -c 'from scripts.v14_test_database import verified_test_url; verified_test_url(); from alembic import command; from alembic.config import Config; command.upgrade(Config("alembic.ini"), "head")'
          python -m alembic current
          python -m alembic heads
      - name: Original safety, golden, Worker and new failure-closed regressions
        run: >-
          python -m pytest tests/unit/test_ab_read_experiment_contract_v14_a4_2.py
          tests/unit/test_a42_ci_partition_contract.py tests/unit/test_a42_receipt_gate.py
          tests/unit/test_a421_artifacts_and_cli.py
          tests/integration/test_ab_read_experiment_v14_a4_2.py
          tests/integration/test_ab_merge_read_v14.py
          tests/integration/test_ab_profile_cursor_v14_a4.py
          tests/integration/test_data_publication.py tests/integration/test_data_queue.py
          tests/integration/test_a42_ci_scope_pg17.py
          tests/integration/test_capacity_level_isolation.py
          --junitxml=.codex_tmp/a421/contract/a42-targeted.xml
      - run: python -m ruff check backend tests migrations scripts
      - name: Explicit contract status, including early failure
        if: always()
        env:
          UPSTREAM_STATUS: ${{ job.status }}
        run: python scripts/ci_release_gate_v14_a4_2_1.py safety-status --job-id contract-and-safety --output .codex_tmp/a421/contract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a421-contract-${{ github.sha }}-attempt${{ github.run_attempt }}
          include-hidden-files: true
          path: .codex_tmp/a421
          if-no-files-found: error
      - if: always()
        run: docker rm -f a421-pg17

  laboratory:
    needs: contract-and-safety
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.contract-and-safety.outputs.matrix) }}
    env:
      LLM_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - uses: ./.github/actions/a421-pg
      - name: Exact workload with per-group atomic checkpoints
        run: >-
          python scripts/ab_read_experiment_v14_a4_2.py
          --scope "${{ matrix.scope }}" --job-id "${{ matrix.job_id }}"
          --container a421-pg17
          --output ".codex_tmp/a421/${{ matrix.job_id }}/manifest.json"
      - name: Explicit status even before fixture initialization
        if: always()
        env:
          UPSTREAM_STATUS: ${{ job.status }}
        run: >-
          python scripts/ci_release_gate_v14_a4_2_1.py status
          --job-id "${{ matrix.job_id }}" --output ".codex_tmp/a421/${{ matrix.job_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a421-${{ matrix.job_id }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          include-hidden-files: true
          path: .codex_tmp/a421
          if-no-files-found: error
      - if: always()
        run: docker rm -f a421-pg17

  a42-acceptance-gate:
    needs: [contract-and-safety, laboratory]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: a421-*-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: .codex_tmp/a421-input
      - name: All mandatory jobs and exact raw receipts; missing evidence blocks
        if: always()
        env:
          A421_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/ci_release_gate_v14_a4_2_1.py lab --output .codex_tmp/a421-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a421-gate-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: .codex_tmp/a421-gate.json
          include-hidden-files: true
          if-no-files-found: error

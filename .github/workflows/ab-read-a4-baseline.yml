name: A4-1 read baseline diagnosis

"on":
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact reviewed 40-character commit SHA
        required: true
        type: string
      confirm_expensive_run:
        description: Explicitly authorize this diagnostic, not production or release
        required: true
        type: boolean
        default: false
      run_reason:
        description: Reviewed nonempty reason (never include credentials)
        required: true
        type: string
      protocol_id:
        description: Fixed protocol ID from the governance policy
        required: true
        type: string
      protocol_sha256:
        description: Frozen protocol SHA256 from the governance policy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'ssh-stock-a4-expensive' || format('a4-l0-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false

jobs:
  authorize:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: a4-expensive-measurements
    env:
      A4_REVIEW_POLICY_ACK: ${{ vars.A4_REVIEW_POLICY_ACK }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/a4-governance
        with:
          suite: a41
      - if: always()
        uses: ./.github/actions/a4-finish
        with:
          status: ${{ job.status }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a4-ci-a41-authorization-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex_tmp/a4-ci
          include-hidden-files: true
          if-no-files-found: error

  contracts:
    needs: authorize
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || needs.authorize.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - uses: ./.github/actions/a421-pg
        with:
          port: '55439'
          database: a4_test
      - name: Observer regressions and frozen safety tests
        run: |
          python -c 'from scripts.v14_test_database import verified_test_url; verified_test_url(); from alembic import command; from alembic.config import Config; command.upgrade(Config("alembic.ini"), "head")'
          python -m pytest tests/unit/test_ab_read_profile_v14_a4.py tests/integration/test_ab_profile_cursor_v14_a4.py tests/integration/test_ab_merge_read_v14.py tests/unit/test_v14_workflow_evidence.py --junitxml=.codex_tmp/v14-a4-targeted.xml
          python -m ruff check backend tests migrations scripts
      - id: cleanup
        if: always()
        uses: ./.github/actions/a4-cleanup
      - if: always()
        uses: ./.github/actions/a4-finish
        with:
          status: ${{ job.status }}
          cleanup: ${{ steps.cleanup.outcome }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-a4-contract-${{ github.sha }}-attempt${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .codex_tmp/v14-a4-targeted.xml
            .codex_tmp/a4-ci
          if-no-files-found: error

  isolated-baseline:
    needs: [authorize, contracts]
    if: github.event_name == 'workflow_dispatch' && needs.authorize.result == 'success' && inputs.confirm_expensive_run == true && inputs.target_sha == github.sha && github.ref == 'refs/heads/master' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: a4-expensive-measurements
    env:
      A4_REVIEW_POLICY_ACK: ${{ vars.A4_REVIEW_POLICY_ACK }}
      DATABASE_URL: postgresql+psycopg://synthetic:synthetic@127.0.0.1:55439/a4_test
      TEST_DATABASE_URL: postgresql+psycopg://synthetic:synthetic@127.0.0.1:55439/a4_test
      TUSHARE_TOKEN: synthetic-a4
      LLM_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/a4-governance
        with:
          suite: a41
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - name: Dedicated physical PG17, fixed resources, I/O and statement evidence
        uses: ./.github/actions/a421-pg
        with:
          port: '55439'
          database: a4_test
      - name: Observer regressions and frozen safety tests
        run: |
          python -c 'from scripts.v14_test_database import verified_test_url; verified_test_url(); from alembic import command; from alembic.config import Config; command.upgrade(Config("alembic.ini"), "head")'
          python -m pytest tests/unit/test_ab_read_profile_v14_a4.py \
            tests/integration/test_ab_profile_cursor_v14_a4.py \
            tests/integration/test_ab_merge_read_v14.py \
            tests/unit/test_v14_workflow_evidence.py --junitxml=.codex_tmp/v14-a4-targeted.xml
          python -m ruff check backend tests migrations scripts
      - name: Serial alternating 10k then 100k then million; never run concurrently
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/ab_read_profile_v14_a4.py --multitable --service-control --monthly \
            --container "$A421_CONTAINER" --output .codex_tmp/v14-a4-10k.json
          python scripts/ab_read_profile_v14_a4.py --public-rows 100000 \
            --candidate-rows 52529 --other-rows 108949 --multitable --service-control --monthly \
            --container "$A421_CONTAINER" --output .codex_tmp/v14-a4-100k.json
          python scripts/ab_read_profile_v14_a4.py --public-rows 2570000 \
            --candidate-rows 1350000 --other-rows 2800000 --multitable --service-control --monthly \
            --container "$A421_CONTAINER" --output .codex_tmp/v14-a4-million.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-a4-baseline-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          include-hidden-files: true
          path: .codex_tmp/v14-a4-*
          if-no-files-found: error
      - id: cleanup
        if: always()
        uses: ./.github/actions/a4-cleanup
      - if: always()
        uses: ./.github/actions/a4-finish
        with:
          status: ${{ job.status }}
          cleanup: ${{ steps.cleanup.outcome }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a4-ci-a41-state-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex_tmp/a4-ci
          include-hidden-files: true
          if-no-files-found: error
